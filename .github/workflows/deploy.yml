# .github/workflows/deploy.yml

name: Deploy to Digital Ocean VPS

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production # specify which environment secrets/variables github should use

    steps:
      - name: 🚀 Deploy to VPS
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          # Note: Environment variables are sourced from /var/www/sontra/.env on the VPS
          # This is required because SSH forced command prevents passing env vars via SSH
          script: |
            bash /home/deployer/deploy.sh
